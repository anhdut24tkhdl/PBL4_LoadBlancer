<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Đức Quang Ánh - Profile</title>

    <!-- Sử dụng Google Fonts: Poppins cho vẻ đẹp hiện đại -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome để dùng các Icon đẹp mắt -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Background gradient xanh/tím hiện đại như yêu cầu */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        /* Phần header của thẻ có màu nền đồng bộ */
        .card-header {
            background: linear-gradient(to right, #667eea, #764ba2);
            height: 150px;
            position: relative;
        }

        .avatar-container {
            position: absolute;
            bottom: -60px; /* Đẩy ảnh xuống giữa ranh giới header và body */
            left: 50%;
            transform: translateX(-50%);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #ffffff;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            background-color: #fff;
        }

        .card-body {
            padding: 70px 30px 30px 30px;
            text-align: center;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 14px;
            color: #667eea;
            font-weight: 500;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-list {
            list-style: none;
            text-align: left;
        }

        .info-item {
            display: flex;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid #edf2f7;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        /* Bỏ viền dưới cho phần tử cuối cùng */
        .info-item:last-child {
            border-bottom: none;
        }

        /* Hiệu ứng Hover mượt mà khi di chuột vào từng dòng */
        .info-item:hover {
            background-color: #f7fafc;
            transform: translateX(5px);
            box-shadow: -2px 2px 8px rgba(0,0,0,0.05);
            border-left: 4px solid #667eea;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            background-color: #ebf4ff;
            color: #667eea;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .info-item:hover .icon-box {
            background-color: #667eea;
            color: #ffffff;
        }

        .info-content {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .info-label {
            font-size: 12px;
            color: #a0aec0;
            font-weight: 500;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 15px;
            color: #2d3748;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Nút liên hệ / Hành động */
        .action-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: opacity 0.3s, transform 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

    </style>
</head>
<body>

    <div class="profile-card">
        
        <!-- Header & Avatar -->
        <div class="card-header">
            <div class="avatar-container">
                <!-- Mình dùng ảnh avatar mặc định với tên viết tắt, bạn có thể thay src bằng link ảnh của bạn -->
                <img src="meo.jpg" alt="Avatar Quang Ánh" class="avatar">
            </div>
        </div>

        <!-- Phần Nội Dung Chính -->
        <div class="card-body">
            <h1 class="name">Nguyễn Đức Quang Ánh</h1>
            <p class="tagline"><i class="fas fa-microchip"></i> Sinh viên Data Science & AI</p>

            <ul class="info-list">
                
                <!-- Dòng Lớp -->
                <li class="info-item">
                    <div class="icon-box"><i class="fas fa-id-badge"></i></div>
                    <div class="info-content">
                        <span class="info-label">Lớp sinh hoạt</span>
                        <span class="info-value">24T_KHDL</span>
                    </div>
                </li>

                <!-- Dòng Trường -->
                <li class="info-item">
                    <div class="icon-box"><i class="fas fa-university"></i></div>
                    <div class="info-content">
                        <span class="info-label">Trường</span>
                        <span class="info-value">Đại học Bách khoa – ĐH Đà Nẵng</span>
                    </div>
                </li>

                <!-- Dòng Khoa -->
                <li class="info-item">
                    <div class="icon-box"><i class="fas fa-laptop-code"></i></div>
                    <div class="info-content">
                        <span class="info-label">Khoa</span>
                        <span class="info-value">Công nghệ Thông tin</span>
                    </div>
                </li>

                <!-- Dòng Ngành -->
                <li class="info-item">
                    <div class="icon-box"><i class="fas fa-brain"></i></div>
                    <div class="info-content">
                        <span class="info-label">Ngành học</span>
                        <span class="info-value">Trí tuệ nhân tạo (AI / Data Science)</span>
                    </div>
                </li>

            </ul>

            <a href="#" class="action-btn">Kết nối với tôi</a>
        </div>
    </div>

</body>
</html>
